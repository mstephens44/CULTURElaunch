<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gradient</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 700px; height: 220px; display: grid; grid-template-rows: 1fr 1fr; }
  .panel { display: flex; align-items: center; justify-content: center; padding: 18px 24px; position: relative; }
  .signature { background: var(--cw-gradient); }
  .surface  { background: var(--cw-gradient-bg); }
  .label {
    position: absolute; bottom: 10px; left: 18px;
    font-family: var(--cw-font-display); font-size: 10px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.85);
  }
  .stops {
    position: absolute; bottom: 10px; right: 18px;
    font-family: var(--cw-font-sans); font-size: 10px; color: rgba(255,255,255,0.85);
    letter-spacing: 0.04em;
  }
  .name {
    font-family: var(--cw-font-display); font-size: 22px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; color: white;
  }
</style>
</head>
<body>
  <div class="panel signature">
    <div class="name">CULTURE&nbsp;CONNECTS.</div>
    <div class="label">Signature gradient · 90°</div>
    <div class="stops">#4F7BFF · #8B69C1 · #B07BC9</div>
  </div>
  <div class="panel surface">
    <div class="name" style="opacity: 0.95;">SURFACE GRADIENT</div>
    <div class="label">Background · 120°</div>
    <div class="stops">#33244D · #4F3D7A · #8B69C1</div>
  </div>
</body>
</html>
