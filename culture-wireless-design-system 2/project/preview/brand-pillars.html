<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brand Pillars</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family: var(--cw-font-sans); background: var(--cw-navy); color: #fff; padding: 26px 28px; }
  .eyebrow { font-family: var(--cw-font-display); font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cw-blue); margin-bottom: 14px; }
  .row { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
  .pillar { padding: 14px 16px; border-left: 2px solid var(--cw-purple); }
  .pillar h3 { font-family: var(--cw-font-display); font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 6px; font-weight: 700; }
  .pillar p { font-size: 12px; line-height: 1.5; color: rgba(255,255,255,0.7); margin: 0; }
</style>
</head>
<body>
  <div class="eyebrow">Brand Pillars</div>
  <div class="row">
    <div class="pillar">
      <h3 class="cw-gradient-text">Connect</h3>
      <p>Authentic connections to the communities we serve. The internet is a necessity, not a luxury.</p>
    </div>
    <div class="pillar">
      <h3 class="cw-gradient-text">Empower</h3>
      <p>There is no power for change greater than a community discovering what it cares about.</p>
    </div>
    <div class="pillar">
      <h3 class="cw-gradient-text">Expand</h3>
      <p>Closing the digital divide, one neighborhood at a time.</p>
    </div>
  </div>
</body>
</html>
