<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signal Icon</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family: var(--cw-font-sans); background: var(--cw-bg-1); padding: 16px 24px; display:flex; align-items: center; gap: 28px; }
  .demo { display:flex; align-items: flex-end; justify-content: center; gap: 6px; padding: 12px 16px; border: 1px solid var(--cw-border-1); border-radius: 12px; background: #fff; }
  .bar { width: 5px; background: var(--cw-gradient); border-radius: 3px; }
  .meta { font-family: var(--cw-font-mono); font-size: 11px; color: var(--cw-fg-3); }
  .meta strong { display:block; font-family: var(--cw-font-display); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cw-fg-1); margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="demo" style="height:90px;">
    <div class="bar" style="height:24px;"></div>
    <div class="bar" style="height:38px;"></div>
    <div class="bar" style="height:52px;"></div>
    <div class="bar" style="height:64px;"></div>
    <div class="bar" style="height:74px;"></div>
    <div class="bar" style="height:80px;"></div>
  </div>
  <div class="demo" style="height:64px; background: var(--cw-navy);">
    <div class="bar" style="height:14px; background:#fff;"></div>
    <div class="bar" style="height:22px; background:#fff;"></div>
    <div class="bar" style="height:32px; background:#fff;"></div>
    <div class="bar" style="height:42px; background:#fff;"></div>
    <div class="bar" style="height:50px; background:#fff;"></div>
  </div>
  <div class="meta">
    <strong>Signal Bars</strong>
    Increasing-height vertical bars.<br>
    Use as standalone icon, favicon,<br>
    or pattern element.
  </div>
</body>
</html>
