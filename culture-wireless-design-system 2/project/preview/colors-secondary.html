<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secondary Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family: var(--cw-font-sans); background: var(--cw-bg-1); padding: 18px 20px; }
  .row { display:grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .swatch { aspect-ratio: 1.6 / 1; border-radius: 12px; padding: 12px; display:flex; flex-direction: column; justify-content: space-between; box-shadow: var(--cw-shadow-1); }
  .name { font-family: var(--cw-font-display); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; }
  .hex  { font-family: var(--cw-font-mono); font-size: 11px; opacity: 0.85; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch" style="background:#FFB900; color:#33244D;">
      <div class="name">Yellow</div><div class="hex">#FFB900</div>
    </div>
    <div class="swatch" style="background:#1A1233; color:#fff;">
      <div class="name">Navy Deep</div><div class="hex">#1A1233</div>
    </div>
    <div class="swatch" style="background:#4F3D7A; color:#fff;">
      <div class="name">Navy Mid</div><div class="hex">#4F3D7A</div>
    </div>
    <div class="swatch" style="background:#CCC1DC; color:#33244D;">
      <div class="name">Lilac</div><div class="hex">#CCC1DC</div>
    </div>
    <div class="swatch" style="background:#DD342A; color:#fff;">
      <div class="name">Error</div><div class="hex">#DD342A</div>
    </div>
  </div>
</body>
</html>
