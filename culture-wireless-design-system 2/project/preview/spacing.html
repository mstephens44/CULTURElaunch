<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spacing Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family: var(--cw-font-sans); background: var(--cw-bg-1); padding: 16px 20px; }
  .row { display:flex; align-items:center; gap: 14px; padding: 4px 0; }
  .label { font-family: var(--cw-font-mono); font-size: 11px; color: var(--cw-fg-3); width: 80px; }
  .bar { height: 14px; background: var(--cw-purple); border-radius: 4px; }
</style>
</head>
<body>
  <div class="row"><div class="label">4 · sp-1</div><div class="bar" style="width:4px;"></div></div>
  <div class="row"><div class="label">8 · sp-2</div><div class="bar" style="width:8px;"></div></div>
  <div class="row"><div class="label">12 · sp-3</div><div class="bar" style="width:12px;"></div></div>
  <div class="row"><div class="label">16 · sp-4</div><div class="bar" style="width:16px;"></div></div>
  <div class="row"><div class="label">24 · sp-5</div><div class="bar" style="width:24px;"></div></div>
  <div class="row"><div class="label">32 · sp-6</div><div class="bar" style="width:32px;"></div></div>
  <div class="row"><div class="label">48 · sp-7</div><div class="bar" style="width:48px;"></div></div>
  <div class="row"><div class="label">64 · sp-8</div><div class="bar" style="width:64px;"></div></div>
  <div class="row"><div class="label">96 · sp-9</div><div class="bar" style="width:96px;"></div></div>
</body>
</html>
