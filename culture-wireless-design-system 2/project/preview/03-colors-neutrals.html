<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neutrals & semantic</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 700px; height: 180px;
    display: grid; grid-template-columns: repeat(7, 1fr);
    font-family: var(--cw-font-sans);
  }
  .swatch { display: flex; flex-direction: column; justify-content: flex-end; padding: 12px 10px; }
  .name { font-family: var(--cw-font-display); font-weight: 600; font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; }
  .hex  { font-size: 10px; opacity: 0.85; margin-top: 2px; }
  .dark { color: white; }
  .light { color: var(--cw-fg-1); }
  .light.bordered { box-shadow: inset 0 0 0 1px var(--cw-border-1); }
</style>
</head>
<body>
  <div class="swatch light bordered" style="background: #FFFFFF;"><div class="name">BG 1</div><div class="hex">#FFFFFF</div></div>
  <div class="swatch light" style="background: #F7F4FB;"><div class="name">BG 2</div><div class="hex">#F7F4FB</div></div>
  <div class="swatch light" style="background: #EFE9F4;"><div class="name">BG 3</div><div class="hex">#EFE9F4</div></div>
  <div class="swatch light" style="background: #D6CFE1;"><div class="name">Border</div><div class="hex">#D6CFE1</div></div>
  <div class="swatch dark" style="background: #6B6478;"><div class="name">FG 3</div><div class="hex">#6B6478</div></div>
  <div class="swatch dark" style="background: #DD342A;"><div class="name">Error</div><div class="hex">#DD342A</div></div>
  <div class="swatch dark" style="background: #93000A;"><div class="name">Err Ctn</div><div class="hex">#93000A</div></div>
</body>
</html>
