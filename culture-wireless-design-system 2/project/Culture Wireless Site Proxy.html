<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Culture Wireless — Site Proxy</title>
<link rel="stylesheet" href="colors_and_type.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--cw-bg-2); color: var(--cw-fg-1); font-family: var(--cw-font-sans); min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  /* ===== Layout ===== */
  .app { min-height: 100vh; display: flex; flex-direction: column; }
  .container { max-width: 1180px; margin: 0 auto; padding: 0 32px; width: 100%; }

  /* ===== Top Nav ===== */
  .nav-wrap { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.86); backdrop-filter: blur(12px); border-bottom: 1px solid var(--cw-border-1); }
  :root[data-theme="dark"] .nav-wrap { background: rgba(26,18,51,0.78); }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; max-width: 1280px; margin: 0 auto; gap: 24px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; }
  .brand img { height: 38px; width: auto; }
  .nav-links { display: flex; gap: 4px; }
  .nav-links a {
    padding: 10px 16px; border-radius: var(--cw-radius-pill);
    font-family: var(--cw-font-display); font-size: 11px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--cw-fg-2); transition: all var(--cw-dur-fast) var(--cw-ease-out);
  }
  .nav-links a:hover { color: var(--cw-purple); background: rgba(139,105,193,0.08); }
  .nav-links a.active { color: var(--cw-white); background: var(--cw-navy); }
  :root[data-theme="dark"] .nav-links a.active { background: var(--cw-purple); }

  /* ===== Theme toggle ===== */
  .theme-toggle {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--cw-border-2);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--cw-fg-2); background: var(--cw-bg-1);
    transition: all var(--cw-dur-fast) var(--cw-ease-out);
  }
  .theme-toggle:hover { color: var(--cw-purple); border-color: var(--cw-purple); }
  .theme-toggle .ico { width: 16px; height: 16px; stroke-width: 2; }
  .theme-toggle .sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .sun { display: inline-block; }
  :root[data-theme="dark"] .theme-toggle .moon { display: none; }
  .nav-actions { display: flex; gap: 10px; align-items: center; }

  /* ===== Buttons ===== */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 22px; border-radius: var(--cw-radius-pill);
    font-family: var(--cw-font-display); font-weight: 600;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    transition: all var(--cw-dur-base) var(--cw-ease-out); white-space: nowrap; }
  .btn-primary { background: var(--cw-gradient); color: var(--cw-white); box-shadow: var(--cw-shadow-glow); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(139,105,193,0.45); }
  .btn-ghost { border: 1px solid var(--cw-border-2); color: var(--cw-fg-1); background: transparent; }
  .btn-ghost:hover { border-color: var(--cw-navy); background: var(--cw-bg-2); }
  .btn-sm { padding: 8px 14px; font-size: 10px; }
  .btn .ico { width: 14px; height: 14px; stroke-width: 2; }

  /* ===== Page Stand-In ===== */
  .page-stand { padding: 80px 0 0; flex: 1; }
  .page-stand > .container { padding-left: 32px; padding-right: 32px; }
  .page-stand .breadcrumb {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--cw-font-mono); font-size: 11px;
    color: var(--cw-fg-3); letter-spacing: 0.04em;
    margin-bottom: 24px;
  }
  .page-stand .breadcrumb .slash { color: var(--cw-purple); }

  .page-title-row {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 32px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .page-stand h1.cw-display {
    font-size: clamp(48px, 7vw, 88px);
    background: var(--cw-gradient);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 0.95;
  }
  .page-stand .lede {
    max-width: 620px; margin-top: 24px;
    font-size: 18px; line-height: 1.55; color: var(--cw-fg-2);
  }
  .page-stand .index-tag {
    font-family: var(--cw-font-mono); font-size: 11px;
    color: var(--cw-purple); letter-spacing: 0.18em;
    text-transform: uppercase; padding-top: 18px;
  }

  /* Sections placeholder grid */
  .sections-grid {
    margin-top: 56px;
    display: grid; grid-template-columns: 200px 1fr; gap: 32px 40px;
    border-top: 1px solid var(--cw-border-1); padding-top: 40px;
  }
  .sections-grid .heading {
    font-family: var(--cw-font-display); font-size: 11px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--cw-fg-3); padding-top: 6px;
  }

  .section-list { display: flex; flex-direction: column; gap: 14px; }
  .section-row {
    display: grid; grid-template-columns: 60px 1fr auto;
    align-items: center; gap: 20px;
    padding: 18px 22px;
    background: var(--cw-bg-1);
    border: 1px solid var(--cw-border-1);
    border-radius: var(--cw-radius-md);
    transition: all var(--cw-dur-fast) var(--cw-ease-out);
  }
  .section-row:hover { border-color: var(--cw-purple); transform: translateX(4px); box-shadow: var(--cw-shadow-2); }
  .section-row .num {
    font-family: var(--cw-font-mono); font-size: 12px;
    color: var(--cw-purple); letter-spacing: 0.04em;
  }
  .section-row .name {
    font-family: var(--cw-font-display); font-size: 14px;
    font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--cw-fg-1);
  }
  .section-row .meta {
    font-family: var(--cw-font-sans); font-size: 12px;
    color: var(--cw-fg-3); margin-top: 4px;
  }
  .section-row .arrow { color: var(--cw-fg-4); }

  /* ===== Real page flow ===== */
  .page-flow { margin-top: 80px; display: flex; flex-direction: column; }
  .page-stand.is-home { padding: 0; }
  .page-stand.is-home .page-flow { margin-top: 0; }
  .page-stand.is-home .page-section:first-child { padding-top: 0; }
  /* Hero section bleeds — kill its page-section padding */
  .page-section.has-hero { padding: 0 !important; background: transparent !important; }
  .page-section.has-hero > * { max-width: none; }
  .wf-hero {
    background:
      radial-gradient(ellipse at 20% 0%, rgba(139,105,193,0.08), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(255,185,0,0.05), transparent 50%);
  }
  .page-section { padding: 72px 32px; }
  .page-section > * { max-width: 1180px; margin: 0 auto; }
  /* Alternate section backgrounds for natural rhythm */
  .page-section:nth-child(even) { background: var(--cw-bg-2); }
  /* First section sits flush under the page header */
  .page-section:first-child { padding-top: 56px; }

  /* ===== Legacy wireframe block (unused, kept for safety) ===== */
  .wf-section {
    margin-top: 16px;
    background: var(--cw-bg-1);
    border: 1px solid var(--cw-border-1);
    border-radius: var(--cw-radius-lg);
    overflow: hidden;
  }
  .wf-head {
    display: grid; grid-template-columns: 60px 1fr;
    align-items: center; gap: 20px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--cw-border-1);
    background: var(--cw-bg-2);
  }
  .wf-head .num {
    font-family: var(--cw-font-mono); font-size: 12px;
    color: var(--cw-purple); letter-spacing: 0.04em;
  }
  .wf-head .name {
    font-family: var(--cw-font-display); font-size: 14px;
    font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--cw-fg-1);
  }
  .wf-head .meta { font-size: 12px; color: var(--cw-fg-3); margin-top: 4px; }
  .wf-body { padding: 28px; background: var(--cw-bg-1); }

  /* ===== Wireframe primitives — mid-fidelity ===== */
  .wf { --w: rgba(51,36,77,0.08); --w2: rgba(51,36,77,0.14); --w3: rgba(51,36,77,0.22); }
  :root[data-theme="dark"] .wf { --w: rgba(255,255,255,0.06); --w2: rgba(255,255,255,0.12); --w3: rgba(255,255,255,0.22); }
  .wf-h2 { font-family: var(--cw-font-display); font-size: 22px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--cw-fg-1); margin-bottom: 4px; }
  .wf-eyebrow { font-family: var(--cw-font-display); font-size: 10px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--cw-purple); margin-bottom: 8px; }
  .wf-sub { font-size: 14px; color: var(--cw-fg-3); line-height: 1.5; max-width: 560px; }
  .wf-text { font-size: 14px; color: var(--cw-fg-2); line-height: 1.55; }
  .wf-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--w2); font-family: var(--cw-font-mono); font-size: 11px; color: var(--cw-fg-2); }
  .wf-pill.dot::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--cw-purple); }
  .wf-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 6px; background: var(--cw-purple); color: white; font-family: var(--cw-font-display); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; border: 1px solid var(--cw-purple); cursor: pointer; }
  .wf-btn.ghost { background: transparent; border-color: var(--cw-border-2); color: var(--cw-fg-1); }
  .wf-btn.gradient { background: var(--cw-gradient); border-color: transparent; }
  .wf-img { background: var(--w); border: 1px dashed var(--w3); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--cw-fg-4); font-family: var(--cw-font-mono); font-size: 11px; min-height: 120px; padding: 12px; text-align: center; }
  .wf-card { background: var(--cw-bg-1); border: 1px solid var(--cw-border-1); border-radius: var(--cw-radius-md); padding: 22px; display: flex; flex-direction: column; gap: 12px; }
  .wf-card.feat { border-color: var(--cw-purple); box-shadow: 0 0 0 1px var(--cw-purple), var(--cw-shadow-2); position: relative; }
  .wf-card.feat::before { content: 'MOST POPULAR'; position: absolute; top: -10px; left: 22px; background: var(--cw-purple); color: white; font-family: var(--cw-font-display); font-size: 9px; letter-spacing: 0.18em; padding: 4px 10px; border-radius: 4px; }
  .wf-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .wf-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .wf-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .wf-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .wf-grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .wf-stack { display: flex; flex-direction: column; gap: 12px; }
  .wf-stack.tight { gap: 6px; }
  .wf-price { font-family: var(--cw-font-display); font-size: 44px; font-weight: 700; line-height: 1; color: var(--cw-fg-1); }
  .wf-price small { font-family: var(--cw-font-sans); font-size: 13px; font-weight: 400; color: var(--cw-fg-3); margin-left: 4px; letter-spacing: 0; text-transform: none; }
  .wf-feature { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: var(--cw-fg-2); }
  .wf-feature::before { content: '✓'; color: var(--cw-purple); font-weight: 700; flex-shrink: 0; }
  .wf-input { display: block; width: 100%; height: 44px; border-radius: 6px; background: var(--cw-bg-2); border: 1px solid var(--cw-border-2); padding: 0 14px; font-family: var(--cw-font-sans); font-size: 14px; color: var(--cw-fg-1); }
  .wf-input::placeholder { color: var(--cw-fg-4); }
  .wf-input.area { height: 120px; padding: 12px 14px; resize: vertical; }
  .wf-label { font-family: var(--cw-font-display); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cw-fg-3); margin-bottom: 6px; display: block; }
  .wf-map { aspect-ratio: 16/9; background: linear-gradient(135deg, rgba(51,36,77,0.06), rgba(139,105,193,0.05)); border: 1px solid var(--cw-border-1); border-radius: 12px; position: relative; overflow: hidden; }
  .wf-map::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--w2) 1px, transparent 1px),
      linear-gradient(90deg, var(--w2) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.6;
  }
  .wf-map .pin { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--cw-purple); box-shadow: 0 0 0 6px rgba(139,105,193,0.22); }
  .wf-map .pin.y { background: var(--cw-yellow); box-shadow: 0 0 0 6px rgba(255,185,0,0.22); }
  .wf-map .lbl { position: absolute; font-family: var(--cw-font-mono); font-size: 10px; color: var(--cw-fg-2); background: var(--cw-bg-1); border: 1px solid var(--cw-border-1); padding: 3px 8px; border-radius: 4px; }
  .wf-list { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--cw-border-1); border-radius: var(--cw-radius-md); overflow: hidden; }
  .wf-list > div { padding: 16px 18px; border-bottom: 1px solid var(--cw-border-1); display: flex; align-items: center; gap: 14px; background: var(--cw-bg-1); }
  .wf-list > div:last-child { border-bottom: none; }
  .wf-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--w2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: var(--cw-font-display); font-size: 13px; color: var(--cw-fg-3); }
  .wf-icon { width: 40px; height: 40px; border-radius: 8px; background: rgba(139,105,193,0.12); color: var(--cw-purple); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .wf-icon i { width: 20px; height: 20px; }
  .wf-icon.lg { width: 56px; height: 56px; }
  .wf-icon.lg i { width: 28px; height: 28px; }
  .wf-stat { font-family: var(--cw-font-display); font-size: 32px; font-weight: 700; color: var(--cw-fg-1); line-height: 1; }
  .wf-faq-q { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--cw-border-1); cursor: pointer; }
  .wf-faq-q .q { font-family: var(--cw-font-sans); font-size: 15px; font-weight: 600; color: var(--cw-fg-1); }
  .wf-faq-q .plus { color: var(--cw-fg-3); font-size: 18px; }
  .wf-channel { aspect-ratio: 1.2; background: var(--cw-bg-2); border: 1px solid var(--cw-border-1); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--cw-fg-3); font-family: var(--cw-font-display); font-size: 11px; font-weight: 600; padding: 4px; text-align: center; }

  @media (max-width: 700px) {
    .wf-grid-3, .wf-grid-2, .wf-grid-4 { grid-template-columns: 1fr; }
    .wf-grid-6 { grid-template-columns: repeat(3, 1fr); }
  }

  /* Page jump links */
  .also-row {
    margin-top: 0; padding: 56px 0; border-top: 1px solid var(--cw-border-1);
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  .also-row .label {
    font-family: var(--cw-font-display); font-size: 10px;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--cw-fg-3);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: var(--cw-radius-pill);
    background: var(--cw-bg-1); border: 1px solid var(--cw-border-1);
    font-family: var(--cw-font-sans); font-size: 13px; color: var(--cw-fg-2);
    transition: all var(--cw-dur-fast) var(--cw-ease-out);
  }
  .chip:hover { color: var(--cw-purple); border-color: var(--cw-purple); background: rgba(139,105,193,0.06); }

  /* Hero (Home only) */
  .hero {
    background: var(--cw-gradient-bg);
    color: var(--cw-white);
    padding: 96px 32px;
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 75%);
  }
  .hero-inner { position: relative; max-width: 1180px; margin: 0 auto; }
  .hero .eyebrow-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: var(--cw-radius-pill);
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
    font-family: var(--cw-font-display); font-size: 10px;
    font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--cw-blue);
  }
  .hero .eyebrow-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cw-yellow); box-shadow: 0 0 0 3px rgba(255,185,0,0.2); }
  .hero h1.cw-display {
    font-size: clamp(56px, 8vw, 104px);
    color: var(--cw-white);
    margin-top: 22px;
    line-height: 0.95;
  }
  .hero h1 .grad {
    background: linear-gradient(90deg, #B07BC9, #FFB900);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero .lede { color: rgba(255,255,255,0.75); max-width: 540px; margin-top: 22px; font-size: 18px; line-height: 1.55; }
  .hero .row { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; }

  /* ===== Footer ===== */
  .footer {
    background: var(--cw-navy);
    color: rgba(255,255,255,0.72);
    padding: 48px 32px 28px;
    margin-top: auto;
  }
  .footer-inner { max-width: 1180px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
  .footer .triplet {
    font-family: var(--cw-font-display); font-size: 11px;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(255,255,255,0.6);
  }
  .footer .triplet .accent { color: var(--cw-yellow); }
  .footer .copyright { font-family: var(--cw-font-mono); font-size: 11px; color: rgba(255,255,255,0.4); }

  /* ===== Site Map (overview block, optional) ===== */
  .sitemap-strip {
    background: var(--cw-bg-1);
    border-top: 1px solid var(--cw-border-1);
    border-bottom: 1px solid var(--cw-border-1);
    padding: 28px 32px;
  }
  .sitemap-inner {
    max-width: 1180px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .sitemap-inner .label {
    font-family: var(--cw-font-display); font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--cw-fg-3);
  }
  .sitemap-inner .crumbs {
    display: flex; align-items: center; gap: 14px;
    font-family: var(--cw-font-mono); font-size: 12px;
  }
  .sitemap-inner .crumbs a { color: var(--cw-fg-3); }
  .sitemap-inner .crumbs a:hover { color: var(--cw-purple); }
  .sitemap-inner .crumbs .sep { color: var(--cw-border-2); }
  .sitemap-inner .crumbs .here { color: var(--cw-purple); font-weight: 600; }

  @media (max-width: 800px) {
    .nav-links { display: none; }
    .sections-grid { grid-template-columns: 1fr; gap: 16px; }
    .section-row { grid-template-columns: 50px 1fr auto; }
    .page-stand { padding: 56px 0 0; }
    .page-section { padding: 48px 20px; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Filled by JS -->
</div>

<script type="application/json" id="sitemap">
{
  "/": {
    "label": "Home",
    "index": "00",
    "title": "CULTURE\nCONNECTS.",
    "lede": "Connect · Empower · Expand. We're closing the digital divide for the unserved, underserved, and unconnected.",
    "isHome": true,
    "sections": [
      { "name": "Hero", "meta": "Brand statement + primary CTA" },
      { "name": "Coverage Map", "meta": "Where we're live · ZIP availability check" },
      { "name": "We Are Culture Wireless", "meta": "Mission, vision, pillars" },
      { "name": "ConnectIQ App", "meta": "Network management on every device" },
      { "name": "Plans Snapshot", "meta": "Fiber · Mobile entry points" },
      { "name": "Testimonials", "meta": "Voices from the communities we serve" },
      { "name": "Sign-Up CTA", "meta": "Free TV with new fiber installs" }
    ]
  },
  "/fiber": {
    "label": "Home Internet",
    "index": "01",
    "title": "HOME\nINTERNET.",

<script>
const sitemap = JSON.parse(document.getElementById('sitemap').textContent);
const ROUTES = Object.keys(sitemap);

function currentRoute() {
  const h = (window.location.hash || '#/').replace(/^#/, '');
  return sitemap[h] ? h : '/';
}

function pageNav(active) {
  const items = ROUTES.filter(r => r !== '/').map(r => {
    const cls = (r === active) ? 'active' : '';
    return `<a href="#${r}" class="${cls}">${sitemap[r].label}</a>`;
  }).join('');
  return `
    <div class="nav-wrap">
      <nav class="nav">
        <a href="#/" class="brand" aria-label="Culture Wireless home">
          <img src="assets/logos/full_logo_transparent_background_250.png" alt="Culture Wireless" />
        </a>
        <div class="nav-links">${items}</div>
        <div class="nav-actions">
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
            <i data-lucide="moon" class="ico moon"></i>
            <i data-lucide="sun" class="ico sun"></i>
          </button>
          <a href="#/account" class="btn btn-ghost btn-sm"><i data-lucide="user"></i> Account</a>
          <a href="#/fiber" class="btn btn-primary btn-sm">Check Availability</a>
        </div>
      </nav>
    </div>
  `;
}

function pageSitemapStrip(active) {
  const here = sitemap[active];
  const others = ROUTES.filter(r => r !== active).slice(0, 5);
  const crumbs = others.map(r => `<a href="#${r}">${sitemap[r].label}</a><span class="sep">·</span>`).join('');
  return `
    <div class="sitemap-strip">
      <div class="sitemap-inner">
        <span class="label">Site Proxy · ${here.index} of ${String(ROUTES.length-1).padStart(2,'0')}</span>
        <div class="crumbs">
          <span class="here">${here.label.toUpperCase()}</span>
          <span class="sep">·</span>
          ${crumbs}
        </div>
      </div>
    </div>
  `;
}

function renderWireframe(name) {
  const fn = WF[name];
  if (fn) return fn();
  return `<div class="wf wf-stack"><div class="wf-bar lg w-50"></div><div class="wf-bar w-90"></div><div class="wf-bar w-70"></div><div class="wf-img" style="min-height:120px;">Content placeholder</div></div>`;
}

function sectionsBlock(here) {
  return here.sections.map((s, i) => {
    const cls = s.name === 'Hero' ? ' has-hero' : '';
    return `
    <section class="page-section${cls}" id="sec-${i}" data-sec="${i}" data-screen-label="${String(i+1).padStart(2,'0')} ${s.name}">
      ${renderWireframe(s.name)}
    </section>
  `;
  }).join('');
}

function pageStandBlock(active) {
  const here = sitemap[active];
  const titleHTML = here.title.split('\n').map(t => t).join('<br/>');
  const others = ROUTES.filter(r => r !== active);
  const chips = others.map(r => `<a href="#${r}" class="chip">${sitemap[r].label} <i data-lucide="arrow-up-right" style="width:12px;height:12px;"></i></a>`).join('');

  const isHome = active === '/';
  return `
    <section class="page-stand${isHome ? ' is-home' : ''}">
      ${isHome ? '' : `
      <div class="container">
        <div class="breadcrumb">
          <a href="#/">CULTUREWIRELESS.COM</a>
          <span class="slash">/</span>
          <span>${here.label.toLowerCase().replace(/\s+/g,'-')}</span>
        </div>
        <div class="page-title-row">
          <h1 class="cw-display">${titleHTML}</h1>
          <div class="index-tag">Page · ${here.index}</div>
        </div>
        <p class="lede">${here.lede}</p>
      </div>`}
      <div class="page-flow">
        ${sectionsBlock(here)}
      </div>
      <div class="container">
        <div class="also-row">
          <span class="label">Jump to</span>
          ${chips}
        </div>
      </div>
    </section>
  `;
}

function footerBlock() {
  return `
    <footer class="footer">
      <div class="footer-inner">
        <div>
          <div class="triplet"><span class="accent">Authentic</span> · Expert · Connected</div>
          <div class="copyright" style="margin-top: 8px;">© 2026 Culture Wireless · Site proxy</div>
        </div>
        <div class="triplet">Unserved · Underserved · Unconnected</div>
      </div>
    </footer>
  `;
}

function render() {
  const active = currentRoute();
  const here = sitemap[active];
  const app = document.getElementById('app');

  app.setAttribute('data-screen-label', `${here.index} ${here.label}`);

  app.innerHTML = `
    ${pageNav(active)}
    ${pageStandBlock(active)}
    ${footerBlock()}
  `;

  if (window.lucide) window.lucide.createIcons();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

// Theme handling
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('cw-theme', t); } catch (e) {}
}
function initTheme() {
  let t = 'light';
  try { t = localStorage.getItem('cw-theme') || 'light'; } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
}
initTheme();

window.addEventListener('hashchange', render);
if (!window.location.hash) window.location.hash = '#/';
render();

document.addEventListener('click', (e) => {
  const btn = e.target.closest('#themeToggle');
  if (!btn) return;
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
});
</script>
